<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo">Etsy<span>Export</span></div>
    <div class="tag">Reviews</div>
  </header>

  <div id="not-listing" class="notice" hidden>
    Open an Etsy <b>product listing</b> page, then click this icon again.
  </div>

  <div id="main" hidden>
    <h1 id="title" title=""></h1>
    <div id="stats" class="stats">Checking reviews…</div>

    <div class="row">
      <span class="label">Reviews</span>
      <div id="scope" class="seg">
        <button data-v="listing" type="button">This item</button>
        <button data-v="shop" type="button">Whole shop</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Sort</span>
      <select id="sort">
        <option>Relevancy</option>
        <option>Recency</option>
        <option>Highest</option>
        <option>Lowest</option>
      </select>
    </div>

    <div class="row two">
      <label>Max pages <input id="maxPages" type="number" min="0" step="1"></label>
      <label>Delay <input id="delay" type="number" min="0" step="0.5">&nbsp;s</label>
    </div>
    <p class="hint">0 pages = export everything. The delay runs between page requests so the export stays gentle on Etsy.</p>

    <button id="start" class="primary" disabled>Export reviews</button>
    <div id="error" class="error" hidden></div>
  </div>

  <footer>Runs locally · no account · no tracking</footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
